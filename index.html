<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAGA LIST - los niveles más malos de GD</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f0f1a;color:white;padding:20px}
header{text-align:center;margin-bottom:20px}
header h1{font-size:48px;letter-spacing:3px}
header p{color:#aaa;margin-top:5px}
.topbar{max-width:800px;margin:0 auto 16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button{border:0;cursor:pointer;padding:10px 18px;border-radius:20px;font-weight:bold;font-size:14px}
.btn-edit{background:#ffd60a;color:black}
.btn-add{background:#34c759;color:white}
.btn-save{background:#0a84ff;color:white}
.btn-danger{background:#ff453a;color:white}
.list{max-width:800px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:#1e1e2e;border-radius:12px;display:flex;overflow:hidden;border:1px solid #333;position:relative}
.thumb{width:280px;min-width:280px;height:140px;background:#222;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.info{padding:14px 18px;flex:1}
.top{display:flex;gap:10px;align-items:center}
.rank{background:#ff2d55;padding:4px 10px;border-radius:20px;font-weight:bold;font-size:14px}
.info h2{font-size:22px}
.author{color:#aaa;margin-top:6px;margin-bottom:8px}
.desc{background:#2e1a4a;border:1px solid #a259ff;color:#d9b3ff;padding:8px 12px;border-radius:10px;font-size:13px;line-height:1.4;margin:8px 0;white-space:pre-wrap}
.diff{display:inline-block;padding:4px 12px;border-radius:20px;font-weight:bold;font-size:13px;color:white}
.card-actions{position:absolute;top:8px;right:8px;display:none;gap:6px}
body.editing .card-actions{display:flex}
.card-actions button{padding:6px 10px;font-size:12px;border-radius:12px}
.panel{max-width:800px;margin:0 auto 18px;background:#1e1e2e;border:1px solid #333;border-radius:12px;padding:18px;display:none}
.panel.show{display:block}
.panel h3{margin-bottom:12px}
.panel label{display:block;font-size:13px;color:#aaa;margin:10px 0 4px}
.panel input,.panel select,.panel textarea{width:100%;padding:10px;border-radius:10px;border:1px solid #444;background:#111;color:white}
.panel textarea{min-height:70px}
.panel .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{max-width:800px;margin:10px auto;text-align:center;color:#888;font-size:13px;line-height:1.5}
@media(max-width:600px){.card{flex-direction:column}.thumb{width:100%}.panel .row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>GAGA LIST</h1><p>los niveles más malos de GD<br>por ddtro</p></header>
<div class="topbar">
  <button class="btn-edit" onclick="toggleEdit()">✏️ Editar lista</button>
  <button class="btn-add" onclick="openForm()">＋ Agregar nivel</button>
  <button class="btn-save" onclick="downloadBackup()">⬇️ Guardar copia</button>
</div>
<div id="panel" class="panel">
  <h3 id="formTitle">Agregar nuevo nivel</h3>
  <label>Nombre del nivel</label><input id="fName" placeholder="Ej: Bloodbath">
  <div class="row">
    <div><label>Autor</label><input id="fAuthor" placeholder="Ej: RobTop"></div>
    <div><label>Dificultad</label><select id="fDiff"><option>Easy Demon</option><option>Medium Demon</option><option>Hard Demon</option><option>Insane Demon</option><option>Extreme Demon</option><option>Insane</option><option>Harder</option><option>Hard</option><option>Normal</option><option>Easy</option></select></div>
  </div>
  <label>Descripción (va a salir en morado)</label><textarea id="fDesc" placeholder="Ej: Este nivel es bien difícil..."></textarea>
  <label>Imagen - sube una foto o pega un link</label><input type="file" id="fFile" accept="image/*">
  <label>O link de la imagen</label><input id="fImg" placeholder="https://... o toe2.png">
  <div style="display:flex;gap:10px;margin-top:16px"><button class="btn-save" onclick="saveLevel()">Guardar nivel</button><button onclick="closeForm()">Cancelar</button></div>
</div>
<div class="list" id="list"></div>
<p class="hint">Solo tú puedes editar con tu contraseña. Solo te la pide una vez por pestaña.</p>
<script>
const ADMIN_PASS = 'karlagaga67';
const DEFAULTS = [
["Theory of Everything 2","RobTop","toe2.png","Easy Demon",""],
["Deadlocked","RobTop","deadlocked.png","Easy Demon",""],
["Clubstep","RobTop","clubstep.png","Easy Demon",""],
["Infinite Circles","Startor","infinite.png","Easy Demon",""],
["Speed Racer","ZenticAlpha","speedracer.png","Easy Demon",""],
["The Lightning Road","timeless real","lightning.png","Easy Demon",""],
["The Nightmare","Jax","nightmare.png","Easy Demon",""],
["Shiver","SpKale","shiver.png","Easy Demon",""],
["Platinum Adventure","Jerry4","platinum.png","Easy Demon",""],
["Electrodynamix","RobTop","electrodynamix.png","Insane",""],
["Hexagon Force","RobTop","hexagon.png","Insane",""],
["Electroman Adventures","RobTop","electroman.png","Insane",""],
["Theory of Everything","RobTop","toe.png","Insane",""],
["xStep","RobTop","xstep.png","Insane",""],
["Clutterfunk","RobTop","clutterfunk.png","Insane",""],
["Jumper","RobTop","jumper.png","Harder",""],
];
let levels = DEFAULTS.map(x=>({name:x[0],author:x[1],img:x[2],diff:x[3],desc:x[4]||''}));
let editing=false, editIndex=-1, loadedFromJson=false;

function colorFor(d){
  if(d.indexOf('Easy Demon')>=0) return '#ff2d55';
  if(d.indexOf('Insane Demon')>=0||d==='Insane') return '#a259ff';
  if(d==='Harder') return '#ffd60a';
  if(d.indexOf('Extreme')>=0) return '#ff0000';
  if(d.indexOf('Hard Demon')>=0) return '#ff6b00';
  return '#0a84ff';
}
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function persist(){ try{ localStorage.setItem('gaga_levels', JSON.stringify(levels)); }catch(e){} }
function checkAuth(){
  if(sessionStorage.getItem('gaga_auth')==='ok') return true;
  const pass = prompt('Pon tu contraseña para editar la lista:');
  if(pass !== ADMIN_PASS){ alert('Contraseña incorrecta.'); return false; }
  sessionStorage.setItem('gaga_auth','ok');
  return true;
}
function render(){
  document.body.classList.toggle('editing', editing);
  document.getElementById('list').innerHTML = levels.map((l,i)=>{
    const img = (l.img.indexOf('data:')===0||l.img.indexOf('http')===0) ? l.img : './'+l.img;
    const descHtml = l.desc ? '<div class="desc">'+esc(l.desc)+'</div>' : '';
    return '<div class="card"><div class="thumb"><img src="'+img+'" onerror="this.style.display=\'none\'"></div>'
    +'<div class="info"><div class="top"><span class="rank">#'+(i+1)+'</span><h2>'+esc(l.name)+'</h2></div>'
    +'<p class="author">por '+esc(l.author)+'</p>'+descHtml+'<span class="diff" style="background:'+colorFor(l.diff)+'">'+esc(l.diff)+'</span></div>'
    +'<div class="card-actions"><button onclick="moveUp('+i+')">↑</button><button onclick="moveDown('+i+')">↓</button><button onclick="editLevel('+i+')">Editar</button><button class="btn-danger" onclick="deleteLevel('+i+')">Borrar</button></div></div>';
  }).join('');
}
function toggleEdit(){
  if(!editing){ if(!checkAuth()) return; }
  editing=!editing; render();
  if(editing) alert('Modo editar activado. Ahora puedes editar cada nivel. Ya no te voy a pedir la contraseña hasta que cierres la página.');
}
function openForm(){
  if(!checkAuth()) return;
  document.getElementById('panel').classList.add('show');
  document.getElementById('formTitle').innerText='Agregar nuevo nivel';
  editIndex=-1; document.getElementById('fName').value=''; document.getElementById('fAuthor').value=''; document.getElementById('fDesc').value=''; document.getElementById('fImg').value=''; document.getElementById('fFile').value='';
  window.scrollTo({top:0,behavior:'smooth'});
}
function closeForm(){ document.getElementById('panel').classList.remove('show'); }
function editLevel(i){
  if(!checkAuth()) return;
  editIndex=i; const l=levels[i];
  document.getElementById('panel').classList.add('show');
  document.getElementById('formTitle').innerText='Editar nivel #'+(i+1);
  document.getElementById('fName').value=l.name; document.getElementById('fAuthor').value=l.author; document.getElementById('fDiff').value=l.diff; document.getElementById('fDesc').value=l.desc||''; document.getElementById('fImg').value=(l.img.indexOf('data:')===0)?'':l.img;
  window.scrollTo({top:0,behavior:'smooth'});
}
function deleteLevel(i){
  if(!checkAuth()) return;
  if(confirm('¿Borrar '+levels[i].name+'?')){ levels.splice(i,1); persist(); render(); }
}
function moveUp(i){ if(i>0){ const t=levels[i-1]; levels[i-1]=levels[i]; levels[i]=t; persist(); render(); } }
function moveDown(i){ if(i<levels.length-1){ const t=levels[i+1]; levels[i+1]=levels[i]; levels[i]=t; persist(); render(); } }
function saveLevel(){
  const name=document.getElementById('fName').value.trim();
  const author=document.getElementById('fAuthor').value.trim()||'???';
  const diff=document.getElementById('fDiff').value;
  const desc=document.getElementById('fDesc').value.trim();
  const url=document.getElementById('fImg').value.trim();
  const file=document.getElementById('fFile').files[0];
  if(!name){ alert('Ponle nombre al nivel'); return; }
  const done=(img)=>{ const obj={name:name,author:author,img:img||'placeholder.png',diff:diff,desc:desc}; if(editIndex>=0) levels[editIndex]=obj; else levels.push(obj); persist(); render(); closeForm(); alert('¡Listo! Nivel guardado.'); };
  if(file){ const r=new FileReader(); r.onload=function(){ done(r.result); }; r.readAsDataURL(file); } else done(url);
}
function downloadBackup(){
  const blob=new Blob([JSON.stringify(levels,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='levels.json'; a.click();
  alert('Te descargó levels.json. Súbelo a tu repo como archivo nuevo para que los cambios les salgan a todos.');
}
// Cargar: primero lo que guardaste en tu navegador, si no hay nada, intentar levels.json de GitHub, si no hay, usar los 16 por defecto
try{ const saved = JSON.parse(localStorage.getItem('gaga_levels')||'null'); if(saved && saved.length>0) levels = saved; }catch(e){}
render();
// Solo si NO tienes nada guardado, intentar leer levels.json (para visitantes)
if(!localStorage.getItem('gaga_levels')){
  fetch('./levels.json').then(function(r){ if(!r.ok) throw new Error('no json'); return r.json(); }).then(function(data){ if(Array.isArray(data)&&data.length>0){ levels=data; render(); } }).catch(function(){});
}
</script>
</body>
</html>
